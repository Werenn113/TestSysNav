<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1180" height="700" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="bold" fill="#111">Test Électronique #2 — Alimentation régulée 3,3 V pour GPS u-blox LEA-5H, depuis le 230 V EDF</text>
  <text x="30" y="50" font-size="11" fill="#555">Structure abaissoir linéaire discrète : fusible → varistance → transfo de sécurité → pont → réservoir → LDO 3,3 V (modules intégrés type EMS 7218 exclus)</text>

  <!-- zone 230V (sécurité) -->
  <rect x="30" y="80" width="330" height="260" rx="8" fill="#fff1f1" stroke="#c22" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="46" y="104" font-size="12" font-weight="bold" fill="#c22">SECTEUR 230 V — zone de sécurité</text>

  <!-- secteur -->
  <circle cx="60" cy="150" r="6" fill="#c22"/>
  <text x="52" y="176" font-size="12" font-weight="bold" fill="#c22">L</text>
  <circle cx="60" cy="330" r="6" fill="#c22"/>
  <text x="52" y="320" font-size="12" font-weight="bold" fill="#c22">N</text>
  <line x1="66" y1="150" x2="330" y2="150" stroke="#c22" stroke-width="2"/>
  <line x1="66" y1="330" x2="330" y2="330" stroke="#c22" stroke-width="2"/>

  <!-- fusible -->
  <rect x="100" y="142" width="50" height="16" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <line x1="100" y1="150" x2="150" y2="150" stroke="#333" stroke-width="1.5"/>
  <text x="92" y="136" font-size="11" font-weight="bold" fill="#333">F1</text>
  <text x="92" y="134" font-size="0"> </text>
  <text x="156" y="136" font-size="10" fill="#333">fusible T 500 mA / 250 V</text>

  <!-- MOV -->
  <line x1="200" y1="150" x2="200" y2="330" stroke="#c22" stroke-width="1.5"/>
  <rect x="192" y="218" width="16" height="44" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <line x1="192" y1="240" x2="208" y2="240" stroke="#333" stroke-width="1"/>
  <text x="216" y="230" font-size="10" fill="#333">RV1 : varistance 275 V</text>
  <text x="216" y="244" font-size="10" fill="#333">(transitoires secteur)</text>

  <!-- transfo -->
  <line x1="270" y1="150" x2="270" y2="330" stroke="#c22" stroke-width="1.5"/>
  <line x1="262" y1="150" x2="278" y2="150" stroke="#c22" stroke-width="2"/>
  <line x1="262" y1="330" x2="278" y2="330" stroke="#c22" stroke-width="2"/>
  <line x1="278" y1="150" x2="278" y2="330" stroke="#c22" stroke-width="0"/>
  <circle cx="300" cy="200" r="30" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <circle cx="300" cy="280" r="30" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="252" y="248" font-size="11" font-weight="bold" fill="#333">TR1</text>
  <text x="216" y="330" font-size="0"> </text>
  <text x="240" y="375" font-size="10" fill="#333">TR1 : transfo de sécurité classe II,</text>
  <text x="240" y="389" font-size="10" fill="#333">230 V / 6 V, 3,2 VA (ex. Myrra 44xxx,</text>
  <text x="240" y="403" font-size="10" fill="#333">isolation renforcée, fusible thermique)</text>
  <line x1="330" y1="200" x2="380" y2="200" stroke="#b06a00" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="330" y1="280" x2="380" y2="280" stroke="#b06a00" stroke-width="2" marker-end="url(#ar)"/>

  <!-- zone basse tension -->
  <rect x="390" y="80" width="760" height="260" rx="8" fill="#f4fbf4" stroke="#1f7a33" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="406" y="104" font-size="12" font-weight="bold" fill="#1f7a33">BASSE TENSION (~6 V crête) → 3,3 V régulé</text>

  <!-- pont -->
  <rect x="400" y="200" width="80" height="80" fill="#fff" stroke="#333" stroke-width="1.5" transform="rotate(45 440 240)"/>
  <text x="398" y="248" font-size="11" font-weight="bold" fill="#333">B1</text>
  <text x="368" y="262" font-size="10" fill="#333">pont</text>
  <text x="358" y="276" font-size="10" fill="#333">DB107S</text>

  <!-- capa reservoir -->
  <line x1="520" y1="200" x2="520" y2="280" stroke="#b06a00" stroke-width="2.5"/>
  <line x1="480" y1="200" x2="700" y2="200" stroke="#b06a00" stroke-width="2"/>
  <line x1="480" y1="280" x2="700" y2="280" stroke="#333" stroke-width="2"/>
  <g>
    <line x1="508" y1="222" x2="532" y2="222" stroke="#333" stroke-width="2"/>
    <line x1="508" y1="230" x2="532" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="520" y1="200" x2="520" y2="222" stroke="#333" stroke-width="2"/>
    <line x1="520" y1="230" x2="520" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="520" y1="280" x2="520" y2="280" stroke="#333" stroke-width="2"/>
  </g>
  <text x="540" y="222" font-size="10" fill="#333">C1 : 1500 µF / 16 V</text>
  <text x="540" y="236" font-size="10" fill="#333">R1 : 10 kΩ (bleeder)</text>
  <line x1="520" y1="200" x2="520" y2="222" stroke="#333" stroke-width="0"/>

  <!-- LDO -->
  <rect x="620" y="180" width="120" height="120" rx="8" fill="#eef6ff" stroke="#1a4d8f" stroke-width="2"/>
  <text x="640" y="204" font-size="12" font-weight="bold" fill="#1a4d8f">U1 : LDO</text>
  <text x="640" y="220" font-size="11" fill="#1a4d8f">LD1117-3.3</text>
  <text x="640" y="238" font-size="9" fill="#555">SOT-223, 800 mA</text>
  <text x="640" y="254" font-size="9" fill="#555">dropout 1,1 V</text>
  <text x="640" y="272" font-size="9" fill="#555">PSRR > 60 dB</text>
  <line x1="700" y1="200" x2="740" y2="200" stroke="#cc2222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="708" y="192" font-size="10" fill="#cc2222">3,3 V</text>
  <line x1="700" y1="280" x2="740" y2="280" stroke="#333" stroke-width="2"/>

  <!-- capas sortie -->
  <g>
    <line x1="780" y1="222" x2="804" y2="222" stroke="#333" stroke-width="2"/>
    <line x1="780" y1="230" x2="804" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="792" y1="200" x2="792" y2="222" stroke="#333" stroke-width="2"/>
    <line x1="792" y1="230" x2="792" y2="280" stroke="#333" stroke-width="2"/>
  </g>
  <line x1="740" y1="200" x2="792" y2="200" stroke="#cc2222" stroke-width="2"/>
  <line x1="740" y1="280" x2="792" y2="280" stroke="#333" stroke-width="2"/>
  <text x="812" y="228" font-size="10" fill="#333">C2 : 22 µF + 100 nF</text>
  <text x="812" y="242" font-size="10" fill="#333">fer F1 : + L1 bead 600 Ω</text>

  <!-- LEA-5H -->
  <rect x="880" y="150" width="240" height="200" rx="10" fill="#eef" stroke="#5b3d8f" stroke-width="2"/>
  <text x="920" y="178" font-size="13" font-weight="bold" fill="#5b3d8f">U2 : u-blox LEA-5H</text>
  <line x1="792" y1="200" x2="880" y2="200" stroke="#cc2222" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="792" y1="280" x2="880" y2="280" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="900" y="220" font-size="10" fill="#333">VCC (3,3 V) + 47 µF + 100 nF</text>
  <text x="900" y="236" font-size="10" fill="#333">au plus près du module</text>
  <text x="900" y="256" font-size="10" fill="#333">RF_IN → antenne passive</text>
  <text x="900" y="272" font-size="10" fill="#333">GND : toutes les broches, plan de masse</text>
  <text x="900" y="292" font-size="10" fill="#333">V_BCKP : pile CR2032 (option)</text>
  <text x="900" y="308" font-size="10" fill="#333">via D1 Schottky, sauvegarde RTC</text>
  <text x="900" y="328" font-size="10" fill="#333">UART TXD1/RXD1 → connecteur</text>

  <!-- antenne -->
  <line x1="1120" y1="180" x2="1120" y2="240" stroke="#333" stroke-width="2"/>
  <rect x="1108" y="150" width="24" height="30" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="1090" y="145" font-size="10" fill="#333">ANT1 patch passive</text>

  <!-- GND rail -->
  <line x1="400" y1="280" x2="400" y2="620" stroke="none"/>
  <line x1="100" y1="620" x2="1120" y2="620" stroke="#111" stroke-width="2.5"/>
  <text x="108" y="640" font-size="12" font-weight="bold" fill="#111">GND commun (plan de masse, reprise sur le 0 V du secondaire TR1)</text>
  <line x1="792" y1="280" x2="792" y2="620" stroke="#333" stroke-width="1"/>
  <line x1="960" y1="350" x2="960" y2="620" stroke="#333" stroke-width="1"/>
  <line x1="520" y1="280" x2="520" y2="620" stroke="#333" stroke-width="1"/>
  <line x1="460" y1="280" x2="460" y2="620" stroke="#333" stroke-width="1"/>

  <!-- notes -->
  <rect x="30" y="440" width="440" height="150" rx="8" fill="#fafafa" stroke="#999"/>
  <text x="46" y="464" font-size="12" font-weight="bold" fill="#333">Budget de puissance</text>
  <text x="46" y="486" font-size="10" fill="#333">LEA-5H : ~50 mA typ., pointes à l'acquisition (~67 mA)</text>
  <text x="46" y="500" font-size="10" fill="#333">→ alim dimensionnée à 300 mA (marge ×4)</text>
  <text x="46" y="522" font-size="10" fill="#333">Valim_min au pire cas (secteur −10 %) :</text>
  <text x="46" y="536" font-size="10" fill="#333">6 × 0,9 × 1,414 − 1,4 (pont) − 1,2 (ondulation) ≈ 5,0 V</text>
  <text x="46" y="550" font-size="10" fill="#333">> 3,3 V + dropout 1,1 V = 4,4 V → OK, marge 0,6 V</text>
  <text x="46" y="572" font-size="10" fill="#333">Dissipation LDO ≈ (5 − 3,3) × 0,07 = 0,12 W → ΔT ≈ 6 °C</text>

  <rect x="490" y="440" width="630" height="150" rx="8" fill="#fafafa" stroke="#999"/>
  <text x="506" y="464" font-size="12" font-weight="bold" fill="#333">Exigences u-blox (Hardware Integration Manual)</text>
  <text x="506" y="486" font-size="10" fill="#333">• VCC : alim stable, ondulation résiduelle &lt; 50 mVpp → LDO + C2/L1/C3</text>
  <text x="506" y="502" font-size="10" fill="#333">• courant d'appel : le condensateur 47 µF local absorbe les pointes</text>
  <text x="506" y="518" font-size="10" fill="#333">• GND : liaison directe et courte sur plan de masse (broches multiples)</text>
  <text x="506" y="534" font-size="10" fill="#333">• Antenne passive : pas de bias V_ANT nécessaire (variante active : VCC_RF + 10 Ω)</text>
  <text x="506" y="554" font-size="10" fill="#333">Sécurité : classe II (pas de terre), F1 en tête, TR1 isolation renforcée,</text>
  <text x="506" y="570" font-size="10" fill="#333">RV1 contre les surtensions, câblage secteur sous gaine/connecteur isolé</text>
</svg>
